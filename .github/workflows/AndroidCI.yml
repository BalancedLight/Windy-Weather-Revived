name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distribution: [play, github]
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, and build Play
        if: matrix.distribution == 'play'
        run: ./gradlew testPlayDebugUnitTest lintPlayRelease bundlePlayRelease --console=plain --stacktrace

      - name: Test, lint, and build GitHub
        if: matrix.distribution == 'github'
        run: ./gradlew testGithubDebugUnitTest lintGithubRelease assembleGithubRelease --console=plain --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindyWeather-${{ matrix.distribution }}-release
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
