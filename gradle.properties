# R8 and lint need far more than Gradle's 512 MiB default; bundlePlayRelease ran the daemon
# out of heap without this.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
# Both are load-bearing. Migrating to AGP's built-in Kotlin (the documented fix for the
# obsolete-variant-API warnings, which the external kotlin-android plugin raises) makes the
# watch face module emit classes.dex, and bundletool then refuses the bundle with
# "Watch face with minSdk >= 33 cannot have dex files".  Verified by trying it: the dex
# suppression in wearWatchFace/build.gradle does not survive the new DSL.  Revisit before
# AGP 10, when these options are removed and the migration becomes mandatory.
android.builtInKotlin=false
android.newDsl=false

# Silences the deprecation notices for the two options above and the three obsolete-variant-API
# notices the kotlin-android plugin triggers.  This hides the warnings; it does not resolve them.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
