# Authoritative Google Play version codes, one per Android application module.
#
# These are the values that actually ship. The root build.gradle reads this file and
# overrides each module's version code through the AGP variant API, then bumps the key
# for the module you just built after a release bundle succeeds.
#
#   ./gradlew :app:bundlePlayRelease          bumps app.versionCode
#   ./gradlew :wearWatchFace:bundleRelease    bumps wearWatchFace.versionCode
#   ...anything -PnoVersionBump               bumps nothing
#
# NOTE: app/build.gradle still declares a versionCode of its own. That value is
# overridden at build time and is no longer what ships; this file wins. It is left in
# place only because app/ is frozen and cannot be edited.
#
# Version names are not touched here. They stay a human decision in each module's
# build.gradle.

app.versionCode=7
wearWatchFace.versionCode=100001
