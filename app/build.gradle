plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = "com.BalancedLight.WindyWeather"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.BalancedLight.WindyWeather"
        minSdk = 21
        targetSdk = 36
        versionCode = 3
        versionName = "1.1.0"
    }

    flavorDimensions += "distribution"
    productFlavors {
        play {
            dimension = "distribution"
        }
        github {
            dimension = "distribution"
            applicationIdSuffix = ".github"
            versionNameSuffix = "-github"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
    }

    kotlin {
        jvmToolchain(21)
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        buildConfig = false
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs = ["src/main/java", "src/main/kotlin"]
            res.srcDirs = ["res"]
        }
        play {
            java.srcDirs = ["src/play/kotlin"]
            res.srcDirs = ["src/play/res"]
        }
        github {
            java.srcDirs = ["src/github/kotlin"]
            res.srcDirs = ["src/github/res"]
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    testImplementation "junit:junit:4.13.2"
}
